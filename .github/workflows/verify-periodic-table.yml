name: Verify Periodic Table of Invariants

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-3mode:
    name: Pure-Q/Z 3-Mode Isolated Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify live math & committed JSON parity across 3 isolated modes
        working-directory: periodic-table-invariants
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          OUT1=$(python3 -I -B verify_periodic_table_invariants.py --check)
          OUT2=$(python3 -I -O -B verify_periodic_table_invariants.py --check)
          OUT3=$(python3 -I -B -W error verify_periodic_table_invariants.py --check)
          printf '%s\n' "$OUT1"
          test "$OUT1" = "$OUT2"
          test "$OUT1" = "$OUT3"

      - name: Run assertion-free unit, AST-guard & tamper suite across 3 isolated modes
        working-directory: periodic-table-invariants
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          for flags in "-I -B" "-I -O -B" "-I -B -W error"; do
            BYTES=$(python3 $flags test_periodic_table_invariants.py | wc -c)
            echo "test_periodic_table_invariants.py [$flags]: rc=0 stdout_bytes=$BYTES"
            test "$BYTES" -eq 0
          done

      - name: Verify zero CRLF and zero bytecode artifacts
        shell: bash
        run: |
          set -euo pipefail
          PYC_COUNT=$(find periodic-table-invariants -name '*.pyc' -o -name '__pycache__' | wc -l)
          test "$PYC_COUNT" -eq 0
          python3 -I -B -c '
          from pathlib import Path
          for p in sorted(Path("periodic-table-invariants").iterdir()):
              if p.is_file() and b"\r" in p.read_bytes():
                  raise SystemExit(f"CRLF detected in {p}")
          '
