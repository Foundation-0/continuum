name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the instruments and the site
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site src css _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="color-scheme" content="dark light">
            <meta http-equiv="refresh" content="0; url=site/">
            <link rel="canonical" href="site/">
            <title>Continuum</title>
            <style>html{background:#070f19;color:#eef4fc;font:1rem system-ui,sans-serif}@media (prefers-color-scheme:light){html{background:#faf5eb;color:#102135}}body{margin:0;min-height:100vh;display:grid;place-items:center}a{color:inherit}</style>
          </head>
          <body>
            <p><a href="site/">Continuum</a></p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
